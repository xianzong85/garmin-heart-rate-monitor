<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心率PK设备设置</title>
    <link rel="stylesheet" href="css/style-optimized.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a2a6c, #2a3a7c);
            color: white;
            font-family: 'DIN', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 20px;
        }

        .settings-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 16px;
            margin-bottom: 5px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #ffcc33;
            box-shadow: 0 0 10px rgba(255, 204, 51, 0.3);
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background-color: #ffcc33;
            color: #1a2a6c;
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn-danger {
            background-color: #ff5252;
            color: white;
        }

        .help-text {
            font-size: 14px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .status-success {
            background-color: rgba(0, 230, 118, 0.2);
            border: 1px solid rgba(0, 230, 118, 0.5);
            color: #00e676;
        }

        .status-error {
            background-color: rgba(255, 82, 82, 0.2);
            border: 1px solid rgba(255, 82, 82, 0.5);
            color: #ff5252;
        }

        .device-info {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .device-info p {
            margin: 5px 0;
        }

        .device-id {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="settings-container">
        <h1>心率PK设备设置</h1>

        <div id="statusMessage" class="status-message"></div>

        <div class="form-group">
            <label for="deviceSelect">选择设备</label>
            <select id="deviceSelect" name="selectedDeviceId" required>
                <option value="">-- 选择设备 --</option>
            </select>
            <p class="help-text">选择一个已注册的设备</p>
        </div>

        <div class="device-info">
            <p><strong>设备ID:</strong> <span class="device-id" id="deviceIdDisplay">正在获取...</span></p>
            <p class="help-text">设备ID是唯一标识符，用于识别此设备</p>
        </div>

        <form id="settingsForm">
            <div class="form-group">
                <label for="roomId">房间ID</label>
                <input type="text" id="roomId" name="roomId" placeholder="6位数字房间ID" pattern="[0-9]{6}" maxlength="6" required>
                <p class="help-text">房间ID用于连接设备和用户，必须是6位数字</p>
            </div>

            <div class="form-group">
                <label for="venueName">场地名称</label>
                <select id="venueSelect" name="venueId" required>
                    <option value="">-- 选择场地 --</option>
                </select>
                <p class="help-text">选择此设备所在的场地</p>
            </div>

            <div class="form-group">
                <label for="deviceName">设备名称 (可选)</label>
                <input type="text" id="deviceName" name="deviceName" placeholder="例如: 健身房大屏">
                <p class="help-text">为此设备设置一个易于识别的名称</p>
            </div>

            <div class="btn-group">
                <button type="button" id="generateRoomIdBtn" class="btn-secondary">生成新房间ID</button>
                <button type="submit" class="btn-primary">保存设置</button>
                <button type="button" id="backToMainBtn" class="btn-secondary">返回主页</button>
            </div>
        </form>
    </div>

    <script>
        // 设备相关变量
        let deviceId = '';
        let currentSettings = null;
        let allDevices = [];

        // 生成设备ID
        function generateDeviceId() {
            // 生成一个新的UUID
            return 'device-' + Math.random().toString(36).substring(2, 15) +
                   Math.random().toString(36).substring(2, 15);
        }

        // 加载所有设备
        async function loadAllDevices() {
            try {
                const response = await fetch('/api/devices');
                const data = await response.json();

                if (data.devices && Array.isArray(data.devices)) {
                    allDevices = data.devices;
                    const deviceSelect = document.getElementById('deviceSelect');

                    // 清空现有选项
                    while (deviceSelect.options.length > 1) {
                        deviceSelect.remove(1);
                    }

                    // 添加设备选项
                    allDevices.forEach(device => {
                        const option = document.createElement('option');
                        option.value = device.device_id;

                        // 显示设备名称和场地
                        let displayText = device.name || device.device_id;
                        if (device.venue_name) {
                            displayText += ` (场地: ${device.venue_name})`;
                        }

                        option.textContent = displayText;
                        deviceSelect.appendChild(option);
                    });

                    // 如果有存储的设备ID，选中它
                    const savedDeviceId = localStorage.getItem('deviceId');
                    if (savedDeviceId) {
                        deviceSelect.value = savedDeviceId;
                        // 触发变化事件加载设备设置
                        deviceSelect.dispatchEvent(new Event('change'));
                    }
                }
            } catch (error) {
                console.error('加载设备列表失败:', error);
                showStatusMessage('加载设备列表失败，请刷新页面重试', true);
            }
        }

        // 生成随机房间ID
        function generateRoomId() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        // 显示状态消息
        function showStatusMessage(message, isError = false) {
            const statusElement = document.getElementById('statusMessage');
            statusElement.textContent = message;
            statusElement.className = 'status-message ' + (isError ? 'status-error' : 'status-success');
            statusElement.style.display = 'block';

            // 5秒后自动隐藏
            setTimeout(() => {
                statusElement.style.display = 'none';
            }, 5000);
        }

        // 加载场地列表
        async function loadVenues() {
            try {
                const response = await fetch('/api/venues');
                const data = await response.json();

                if (data.venues && Array.isArray(data.venues)) {
                    const venueSelect = document.getElementById('venueSelect');

                    // 清空现有选项
                    while (venueSelect.options.length > 1) {
                        venueSelect.remove(1);
                    }

                    // 添加场地选项
                    data.venues.forEach(venue => {
                        const option = document.createElement('option');
                        option.value = venue.id;
                        option.textContent = venue.name;
                        if (venue.description) {
                            option.title = venue.description;
                        }
                        venueSelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载场地列表失败:', error);
                showStatusMessage('加载场地列表失败，请刷新页面重试', true);
            }
        }

        // 加载设备设置
        async function loadDeviceSettings(selectedDeviceId) {
            // 如果没有选择设备，清空表单
            if (!selectedDeviceId) {
                document.getElementById('deviceIdDisplay').textContent = '未选择设备';
                document.getElementById('roomId').value = '';
                document.getElementById('deviceName').value = '';
                document.getElementById('venueSelect').value = '';
                return;
            }

            try {
                const response = await fetch(`/api/device?deviceId=${selectedDeviceId}`);
                const data = await response.json();

                if (data.device) {
                    currentSettings = data.device;
                    deviceId = selectedDeviceId;

                    // 显示设备ID
                    document.getElementById('deviceIdDisplay').textContent = deviceId;

                    // 填充表单
                    document.getElementById('roomId').value = data.device.room_id || generateRoomId();
                    document.getElementById('deviceName').value = data.device.name || '';

                    // 选择场地
                    if (data.device.venue_id) {
                        document.getElementById('venueSelect').value = data.device.venue_id;
                    }

                    // 保存到localStorage
                    localStorage.setItem('deviceId', deviceId);

                    showStatusMessage('已加载设备设置');
                } else {
                    // 如果没有找到设备，创建新设备
                    createNewDevice();
                }
            } catch (error) {
                console.error('加载设备设置失败:', error);
                showStatusMessage('加载设备设置失败', true);
            }
        }

        // 移除了创建新设备的功能

        // 保存设备设置
        async function saveDeviceSettings(formData) {
            // 如果没有选择设备，显示错误消息
            if (!deviceId) {
                showStatusMessage('请先选择一个设备', true);
                return;
            }

            try {
                const deviceInfo = {
                    deviceId: deviceId,
                    roomId: formData.get('roomId'),
                    venueId: formData.get('venueId'),
                    name: formData.get('deviceName') || null
                };

                const response = await fetch('/api/device', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(deviceInfo)
                });

                const data = await response.json();

                if (data.success) {
                    // 保存成功
                    showStatusMessage('设置已保存');

                    // 保存到localStorage
                    localStorage.setItem('deviceId', deviceId);
                    localStorage.setItem('roomId', deviceInfo.roomId);

                    // 更新当前设置
                    currentSettings = data.device;

                    // 重新加载设备列表
                    await loadAllDevices();
                } else {
                    // 保存失败
                    showStatusMessage(data.error || '保存设置失败', true);
                }
            } catch (error) {
                console.error('保存设备设置失败:', error);
                showStatusMessage('保存设置失败，请重试', true);
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', async function() {
            // 加载场地列表
            await loadVenues();

            // 加载设备列表
            await loadAllDevices();

            // 设备选择变化事件
            document.getElementById('deviceSelect').addEventListener('change', function() {
                const selectedDeviceId = this.value;
                if (selectedDeviceId) {
                    loadDeviceSettings(selectedDeviceId);
                } else {
                    // 清空表单
                    document.getElementById('deviceIdDisplay').textContent = '未选择设备';
                    document.getElementById('roomId').value = '';
                    document.getElementById('deviceName').value = '';
                    document.getElementById('venueSelect').value = '';
                }
            });

            // 移除了创建新设备按钮

            // 生成新房间ID按钮
            document.getElementById('generateRoomIdBtn').addEventListener('click', function() {
                document.getElementById('roomId').value = generateRoomId();
            });

            // 返回主页按钮
            document.getElementById('backToMainBtn').addEventListener('click', function() {
                window.location.href = '/';
            });

            // 表单提交
            document.getElementById('settingsForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const formData = new FormData(this);
                await saveDeviceSettings(formData);
            });

            // 如果有存储的设备ID，尝试加载它
            const savedDeviceId = localStorage.getItem('deviceId');
            if (savedDeviceId) {
                // 尝试在设备选择器中选中该设备
                const deviceSelect = document.getElementById('deviceSelect');
                deviceSelect.value = savedDeviceId;

                // 如果选中成功，加载设备设置
                if (deviceSelect.value === savedDeviceId) {
                    loadDeviceSettings(savedDeviceId);
                }
            }
            // 如果没有选中设备，不做任何操作，等待用户选择
        });
    </script>
</body>
</html>
