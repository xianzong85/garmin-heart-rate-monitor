<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>佳明手表心率监测</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header">
                        <h2 class="text-center">佳明手表心率监测</h2>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <button id="connectBtn" class="btn btn-primary">连接设备</button>
                            <button id="disconnectBtn" class="btn btn-danger" style="display: none;">断开连接</button>
                        </div>
                        <div id="statusText" class="alert alert-info text-center">
                            请点击连接设备按钮开始监测心率
                        </div>
                        <div id="heartRateDisplay" class="text-center mb-4" style="display: none;">
                            <h3>当前心率: <span id="currentHeartRate">--</span> BPM</h3>
                        </div>
                        <canvas id="heartRateChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
